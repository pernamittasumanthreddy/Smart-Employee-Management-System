[tool.poetry]
name = "smart-employee-management-system"
version = "2.5.0"
description = "Enterprise Smart Employee Management System (EMS) with 34 Modules, AI Analytics, Payroll, Compliance, and Workforce Rostering"
authors = ["Pernamitta Sumanth Reddy <pernamittasumanthreddy@gmail.com>"]
readme = "README.md"
packages = [{include = "apps"}, {include = "config"}]

[tool.poetry.dependencies]
python = "^3.12"
django = ">=5.0.0,<6.0.0"
pandas = ">=2.2.0"
numpy = ">=1.26.0"
scikit-learn = ">=1.4.0"
pillow = ">=10.0.0"
pytest = ">=8.0.0"
pytest-django = ">=4.8.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "RUF012",  # Mutable default for class attributes in Django Models and Migrations
    "E501",    # Line too long
    "E402",    # Module level import not at top of file (used after django.setup())
    "W291",    # Trailing whitespace
    "W293",    # Blank line contains whitespace
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
